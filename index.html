<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayak Yolculuğu – Erciyes</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, sans-serif;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("kayaklogo.jpeg") center / cover no-repeat fixed;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  animation: sway 6s ease-in-out infinite;
}

@keyframes sway {
  0% { transform: translateX(0); }
  50% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

.location {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 1rem;
  margin-bottom: 16px;
  opacity: 0.9;
}

.timer div {
  font-size: clamp(2rem, 5vw, 3.4rem);
  font-weight: 800;
  margin: 4px 0;
}

#finalScreen {
  display: none;
  max-width: 90vw;
}

#finalScreen h1 {
  font-size: clamp(2.4rem, 6vw, 3.4rem);
}

#finalScreen p {
  margin: 8px 0;
  opacity: 0.9;
}

.mapBtn {
  display: inline-block;
  margin-top: 14px;
  padding: 12px 22px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 22px;
  color: #fff;
  text-decoration: none;
  font-size: 0.95rem;
}

.mapBtn:hover {
  background: rgba(255,255,255,0.25);
}

.info {
  font-size: 0.85rem;
  margin-top: 12px;
  opacity: 0.75;
}

.footer {
  position: fixed;
  bottom: 12px;
  width: 100%;
  text-align: center;
  font-size: 0.75rem;
  opacity: 0.6;
  z-index: 2;
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="container" id="countdownContainer">
  <div class="location">Kayseri Erciyes Kayak Merkezi</div>
  <div class="subtitle">Yola çıkmaya kalan süre</div>
   <div class="subtitle">AZ KALDI AMK</div>

  <div class="timer">
    <div id="days">-- Gün</div>
    <div id="hours">-- Saat</div>
    <div id="minutes">-- Dakika</div>
    <div id="seconds">-- Saniye</div>
  </div>

  <div class="info">6 Şubat 22:00 – 23:59 Baz Alınmıştır.</div>
</div>

<div class="container" id="finalScreen">
  <h1>YOLA ÇIKILDI</h1>
  <p>İyi yolculuklar 🚗❄️</p>
  <p><strong>Tahmini Varış:</strong> 7 Şubat 06:00 – 08:00</p>

  <a class="mapBtn"
     href="yandexmaps://maps.yandex.com/?rtext=Kağıthane İETT Garajı~Erciyes Hacılar&rtt=auto"
     onclick="fallbackMap(event)">
     📍 Yandex Maps’te Rotayı Aç
  </a>
</div>

<div class="footer">
  KASTAMONU SKI COMMUNITY – TÜM HAKLARI SAKLIDIR
</div>

<audio id="windSound" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_2f27b0e1df.mp3" type="audio/mpeg">
</audio>

<script>
/* === TARİH === */
const startTime = new Date("2026-02-06T22:00:00");

const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");

const countdownContainer = document.getElementById("countdownContainer");
const finalScreen = document.getElementById("finalScreen");

const wind = document.getElementById("windSound");
wind.volume = 0.25;

/* === GERİ SAYIM === */
function updateCountdown() {
  const now = new Date();
  let diff = startTime - now;

  if (diff <= 0) {
    countdownContainer.style.display = "none";
    finalScreen.style.display = "block";
    wind.volume = 0.45; // YOLA ÇIKILINCA SES ARTIYOR
    wind.play();
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const minutes = Math.floor(diff / (1000 * 60)) % 60;
  const seconds = Math.floor(diff / 1000) % 60;

  daysEl.textContent = days + " Gün";
  hoursEl.textContent = hours + " Saat";
  minutesEl.textContent = minutes + " Dakika";
  secondsEl.textContent = seconds + " Saniye";
}

setInterval(updateCountdown, 1000);
updateCountdown();

/* === KAR (YOĞUN + BİRAZ DAHA HIZLI) === */
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const flakes = Array.from({ length: 220 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 3 + 1,
  d: Math.random() * 1.4 + 0.6
}));

function snow() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath();

  flakes.forEach(f => {
    ctx.moveTo(f.x, f.y);
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    f.y += f.d;
    if (f.y > canvas.height) {
      f.y = -10;
      f.x = Math.random() * canvas.width;
    }
  });

  ctx.fill();
}
setInterval(snow, 30);

/* === YANDEX FALLBACK === */
function fallbackMap(e) {
  setTimeout(() => {
    window.location.href =
      "https://yandex.com/maps/?rtext=Kağıthane İETT Garajı~Erciyes Hacılar&rtt=auto";
  }, 500);
}
</script>

</body>
</html>
