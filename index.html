
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>Erzurum Palandöken Kayak Geri Sayım</title>

<style>
:root {
  --red: #ff303b;
  --white: #f7f9fc;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow: hidden;
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("arkaplan1.jpeg") center center / cover no-repeat fixed,
    #101a2b;
}

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.overlay {
  min-height: 100vh;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 18px 58px;
  text-align: center;
}

.content {
  width: min(100%, 720px);
  animation: float 5s ease-in-out infinite;
}

.eyebrow {
  margin: 0 0 13px;
  font-size: 12px;
  letter-spacing: 5px;
  color: rgba(255,255,255,.76);
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(29px, 6vw, 58px);
  line-height: 1.08;
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 0 4px 25px rgba(0,0,0,.5);
}

.subtitle {
  margin: 13px 0 34px;
  color: rgba(255,255,255,.83);
  font-size: clamp(14px, 2.4vw, 18px);
  letter-spacing: 1.5px;
}

.countdown {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  margin: 0 auto 27px;
}

.unit {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 11px;
  min-width: 210px;
}

.number {
  color: var(--red);
  font-size: clamp(43px, 8vw, 68px);
  line-height: 1;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 22px rgba(255,48,59,.35);
}

.unit-label {
  min-width: 82px;
  text-align: left;
  font-size: 13px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.83);
}

.departed {
  display: none;
}

.departed h2 {
  margin: 0 0 12px;
  color: var(--red);
  font-size: clamp(35px, 7vw, 65px);
  font-weight: 900;
  text-shadow: 0 0 25px rgba(255,48,59,.25);
}

.departed p {
  margin: 10px 0;
  font-size: clamp(17px, 3vw, 23px);
}

.arrival {
  color: rgba(255,255,255,.78);
  font-size: 15px !important;
  line-height: 1.7;
}

.map-link {
  display: inline-block;
  margin-top: 24px;
  padding: 14px 23px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 7px;
  color: white;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  background: rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
  transition: .2s;
}

.map-link:hover {
  background: rgba(255,255,255,.23);
  transform: translateY(-2px);
}

.sound {
  position: fixed;
  z-index: 4;
  top: 18px;
  right: 18px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 30px;
  padding: 9px 13px;
  color: white;
  background: rgba(0,0,0,.25);
  cursor: pointer;
  font-size: 12px;
  backdrop-filter: blur(6px);
}

footer {
  position: fixed;
  z-index: 3;
  bottom: 13px;
  left: 10px;
  right: 10px;
  text-align: center;
  color: rgba(255,255,255,.58);
  font-size: 10px;
  letter-spacing: 1.2px;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@media (max-height: 650px) {
  .overlay {
    padding-top: 20px;
    padding-bottom: 42px;
  }

  .subtitle { margin-bottom: 18px; }
  .countdown { gap: 7px; }

  .number {
    font-size: clamp(36px, 7vh, 54px);
  }
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<button class="sound" id="soundButton" type="button">
  ♫ Sesi aç
</button>

<main class="overlay">

  <section class="content" id="countdownScreen">

    <p class="eyebrow">Kışın çağrısına hazır ol</p>

    <h1>
      ERZURUM PALANDÖKEN<br>
      KAYAK MERKEZİ
    </h1>

    <p class="subtitle">YOLA ÇIKMAYA KALAN SÜRE</p>

    <div class="countdown" aria-live="off">

      <div class="unit">
        <span class="number" id="days">000</span>
        <span class="unit-label">GÜN</span>
      </div>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="unit-label">SAAT</span>
      </div>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="unit-label">DAKİKA</span>
      </div>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="unit-label">SANİYE</span>
      </div>

    </div>

  </section>

  <section class="content departed" id="departedScreen">

    <h2>YOLA ÇIKILDI</h2>

    <p>İyi yolculuklar! 🚗❄️</p>

    <p class="arrival">
      Tahmini varış zamanı<br>
      <strong>20 Mart 2027 · 10:00</strong>
    </p>

    <a
      class="map-link"
      href="https://yandex.com/maps/?rtext=Ka%C4%9F%C4%B1thane%2C%20%C4%B0stanbul~Paland%C3%B6ken%20Kayak%20Merkezi%2C%20Erzurum&rtt=auto"
      target="_blank"
      rel="noopener noreferrer"
    >
      YANDEX HARİTALARDA ROTAYI AÇ
    </a>

  </section>

</main>

<footer>
  KASTAMONU SKI COMMUNITY – TÜM HAKLARI SAKLIDIR
</footer>

<script>

// Çıkış tarihi: 19 Mart 2027, saat 22:00
const departureTime =
  new Date("2027-03-19T22:00:00+03:00").getTime();

const $ = id => document.getElementById(id);

function updateCountdown() {

  const remaining = departureTime - Date.now();

  if (remaining <= 0) {
    $("countdownScreen").style.display = "none";
    $("departedScreen").style.display = "block";
    return;
  }

  const totalSeconds = Math.floor(remaining / 1000);

  $("days").textContent =
    String(Math.floor(totalSeconds / 86400)).padStart(3, "0");

  $("hours").textContent =
    String(Math.floor((totalSeconds % 86400) / 3600)).padStart(2, "0");

  $("minutes").textContent =
    String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");

  $("seconds").textContent =
    String(totalSeconds % 60).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);


// Dikey kar yağışı

const canvas = $("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resizeSnow() {

  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;

  ctx.setTransform(
    devicePixelRatio, 0, 0,
    devicePixelRatio, 0, 0
  );

  flakes = Array.from(
    { length: Math.min(150, Math.floor(window.innerWidth / 7)) },
    () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 2.2 + .5,
      speed: Math.random() * 1.4 + .6,
      opacity: Math.random() * .65 + .2
    })
  );
}

function snow() {

  ctx.clearRect(
    0, 0,
    window.innerWidth,
    window.innerHeight
  );

  for (const f of flakes) {

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
    ctx.fill();

    f.y += f.speed;

    if (f.y > window.innerHeight + 5) {
      f.y = -5;
      f.x = Math.random() * window.innerWidth;
    }
  }

  requestAnimationFrame(snow);
}

window.addEventListener("resize", resizeSnow);
resizeSnow();
snow();


// Rüzgâr sesi

let audioContext, windSource, windGain, soundOn = false;

$("soundButton").addEventListener("click", async () => {

  try {

    if (!audioContext) {

      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      const bufferSize = audioContext.sampleRate * 3;

      const buffer = audioContext.createBuffer(
        1, bufferSize, audioContext.sampleRate
      );

      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * .22;
      }

      windSource = audioContext.createBufferSource();
      windSource.buffer = buffer;
      windSource.loop = true;

      const filter = audioContext.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 420;

      windGain = audioContext.createGain();
      windGain.gain.value = 0;

      windSource.connect(filter);
      filter.connect(windGain);
      windGain.connect(audioContext.destination);

      windSource.start();
    }

    await audioContext.resume();

    soundOn = !soundOn;

    windGain.gain.setTargetAtTime(
      soundOn ? .10 : 0,
      audioContext.currentTime,
      .3
    );

    $("soundButton").textContent =
      soundOn ? "♫ Sesi kapat" : "♫ Sesi aç";

  } catch (e) {

    $("soundButton").textContent = "Ses kullanılamıyor";

  }

});

</script>

</body>
</html>
