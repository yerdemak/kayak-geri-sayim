<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>Erzurum Palandöken Kayak Geri Sayım</title>

<style>
:root {
  --jersey-blue: #13294B; /* Forma rengi */
  --white: #f7f9fc;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  color: var(--white);
  font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("arkaplan1.jpeg") center center / cover no-repeat fixed,
    #101a2b;
}

#snow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.overlay {
  min-height: 100vh;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 18px 80px;
  text-align: center;
}

.content {
  width: min(100%, 720px);
  animation: float 5s ease-in-out infinite;
}

.eyebrow {
  margin: 0 0 8px;
  font-size: 11px;
  letter-spacing: 5px;
  color: rgba(255,255,255,.76);
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 48px);
  line-height: 1.08;
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 0 4px 25px rgba(0,0,0,.5);
}

.subtitle {
  margin: 8px 0 14px;
  color: rgba(255,255,255,.83);
  font-size: clamp(12px, 2.1vw, 16px);
  letter-spacing: 1.5px;
}

/* Sayaç Stilleri */
.countdown {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin: 0 auto 15px;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 210px;
}

.number {
  color: var(--jersey-blue);
  font-size: clamp(38px, 7vw, 62px);
  line-height: 1;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 22px rgba(19,41,75,.35);
}

.unit-label {
  margin-top: 4px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.83);
}

/* 6 Günlük Hava Durumu Stilleri */
.weather-card {
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  padding: 10px 12px;
  margin: 10px auto;
  color: #fff;
  text-align: center;
}

.weather-card h3 {
  margin: 0 0 8px;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.85);
  text-transform: uppercase;
}

.forecast-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
}

.forecast-day {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 5px 2px;
  border-radius: 6px;
  font-size: 0.75rem;
}

.forecast-day .date {
  font-weight: bold;
  margin-bottom: 2px;
  display: block;
  font-size: 0.65rem;
  opacity: 0.8;
}

.forecast-day .temp {
  font-size: 0.8rem;
  margin-top: 2px;
}

/* Masraf Butonu */
.center-expense-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 30px;
  color: white;
  background: rgba(0,0,0,.3);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  backdrop-filter: blur(6px);
  transition: 0.2s;
}

.center-expense-btn:hover {
  background: rgba(255,255,255,.15);
  transform: translateY(-2px);
}

/* Şeffaf Masraf Paneli (Modal) Stilleri */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(12px);
  z-index: 10;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.modal-content {
  background: rgba(16, 26, 43, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 14px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  text-align: left;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  color: white;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.15);
  padding-bottom: 8px;
  margin-bottom: 12px;
}

.modal-header h3 {
  margin: 0;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.9);
  text-transform: uppercase;
}

.close-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
}

.form-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.form-group {
  flex: 1;
}

.form-group label {
  display: block;
  font-size: 10px;
  margin-bottom: 3px;
  color: rgba(255,255,255,0.75);
}

.form-group input, .form-group select {
  width: 100%;
  height: 38px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 6px;
  color: white;
  font-size: 12px;
}

.form-group select option {
  background: #101a2b;
  color: white;
}

.add-expense-btn {
  width: 100%;
  padding: 10px;
  background: var(--jersey-blue);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
  letter-spacing: 0.5px;
}

.expense-list {
  margin-top: 12px;
  max-height: 120px;
  overflow-y: auto;
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 8px;
}

.expense-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.05);
  padding: 6px 10px;
  border-radius: 5px;
  margin-bottom: 5px;
  font-size: 11px;
}

.delete-exp {
  background: none;
  border: none;
  color: #ff303b;
  cursor: pointer;
  font-weight: bold;
  font-size: 11px;
}

.settlement-summary {
  margin-top: 12px;
  background: rgba(0, 255, 128, 0.08);
  border: 1px solid rgba(0, 255, 128, 0.3);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 11px;
}

.settlement-summary h4 {
  margin: 0 0 5px;
  color: #00ff80;
  font-size: 11px;
}

.departed {
  display: none;
}

.departed h2 {
  margin: 0 0 10px;
  color: var(--jersey-blue);
  font-size: clamp(30px, 6vw, 55px);
  font-weight: 900;
  text-shadow: 0 0 25px rgba(19,41,75,.25);
}

.departed p {
  margin: 8px 0;
  font-size: clamp(15px, 2.5vw, 20px);
}

.arrival {
  color: rgba(255,255,255,.78);
  font-size: 13px !important;
  line-height: 1.5;
}

.map-link {
  display: inline-block;
  margin-top: 15px;
  padding: 11px 20px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 7px;
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  background: rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
  transition: .2s;
}

.map-link:hover {
  background: rgba(255,255,255,.23);
  transform: translateY(-2px);
}

/* Sağ üst ses butonu */
.sound {
  position: fixed;
  z-index: 4;
  top: 15px;
  right: 15px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 30px;
  padding: 8px 14px;
  color: white;
  background: rgba(0,0,0,.25);
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  backdrop-filter: blur(6px);
  transition: 0.2s;
}

.sound:hover {
  background: rgba(255,255,255,.15);
}

#silentBanner {
  position: fixed;
  z-index: 5;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 30px;
  padding: 8px 16px;
  color: white;
  background: rgba(0,0,0,.35);
  font-size: 11px;
  font-weight: 600;
  backdrop-filter: blur(6px);
  display: none;
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition: opacity 0.5s ease;
}

footer {
  position: fixed;
  z-index: 3;
  bottom: 8px;
  left: 10px;
  right: 10px;
  text-align: center;
  color: rgba(255,255,255,.58);
  font-size: 9px;
  letter-spacing: 1px;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@media (max-height: 750px) {
  body { overflow-y: auto; }
  .overlay { padding-bottom: 40px; }
  .content { animation: none; }
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<!-- Sağ üstte orijinal ses butonu -->
<button class="sound" id="soundButton" type="button">
  ♫ Sesi aç
</button>

<!-- En üstte en ortada çıkacak uyarı banner'ı -->
<div id="silentBanner">🔕 Telefonu Sessiz Moddan Çıkarın</div>

<main class="overlay">

  <section class="content" id="countdownScreen">

    <p class="eyebrow">Kışın çağrısına hazır ol</p>

    <h1>
      ERZURUM PALANDÖKEN<br>
      KAYAK MERKEZİ
    </h1>

    <p class="subtitle">YOLA ÇIKMAYA KALAN SÜRE</p>

    <!-- Sayaç -->
    <div class="countdown" aria-live="off">
      <div class="unit">
        <span class="number" id="days">000</span>
        <span class="unit-label">GÜN</span>
      </div>
      <div class="unit">
